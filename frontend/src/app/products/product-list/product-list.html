<div class="toolbar">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Min price</mat-label>
    <input matInput type="number" #min />
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Max price</mat-label>
    <input matInput type="number" #max />
  </mat-form-field>

  <button mat-flat-button (click)="applyFilter(min.value, max.value)">Apply</button>
  <button mat-button (click)="min.value = ''; max.value = ''; clearFilter()">Clear</button>

  <a mat-flat-button class="new-product" routerLink="/products/new">New product</a>
</div>
<table mat-table [dataSource]="products()">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let p"><a [routerLink]="['/products', p.id]">{{ p.name }}</a></td>
  </ng-container>

  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef>Price</th>
    <td mat-cell *matCellDef="let p">{{ p.price }}</td>
  </ng-container>

  <ng-container matColumnDef="stock">
    <th mat-header-cell *matHeaderCellDef>Stock</th>
    <td mat-cell *matCellDef="let p">{{ p.stock }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
  <th mat-header-cell *matHeaderCellDef></th>
  <td mat-cell *matCellDef="let p">
    <a mat-button [routerLink]="['/products', p.id, 'edit']">Edit</a>
    <button mat-button (click)="delete(p)">Delete</button>
  </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
  <mat-paginator
  [length]="total()"
  [pageSize]="pageSize()"
  [pageIndex]="pageIndex()"
  [pageSizeOptions]="[5, 10, 25]"
  (page)="onPage($event)"
  />
